name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stallioncrm?schema=public
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stallioncrm_test?schema=public
  E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stallioncrm_e2e?schema=public
  AUTH_SECRET: ci-only-secret-not-for-production-0123456789abcdef
  AUTH_TRUST_HOST: "true"

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stallioncrm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE stallioncrm_test'
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE stallioncrm_e2e'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Brand isolation is the product's core guarantee: its suite is a named step so it can be a required check.
      - name: Brand-isolation suite
        run: pnpm test:isolation
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - run: pnpm build-storybook
      - name: E2E
        run: |
          pnpm exec playwright install --with-deps chromium
          E2E_USE_BUILD=1 CI=1 pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
